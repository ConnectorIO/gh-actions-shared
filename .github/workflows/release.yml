name: Release

on:
  workflow_call:
    inputs:
      openhab:
        description: 'Turns "openHAB" mode for build which assume certain branch policies (3.*=java 11, 4.*=java 17, 5.*=java 21)'
        required: false
        default: false
        type: boolean
      master_branch:
        description: 'Determine if repository uses master branch, and if build use openHAB mode, in which openHAB version it is expected to operate (v 3 or 4 or 5)'
        required: false
        default: 'master'
        type: string
      release_version:
        description: 'The version to be released from actual HEAD revision'
        required: false
        default: 'X.Y.Z'
        type: string
      development_version:
        description: 'Version to be set as next, after release is made (appends commit to HEAD revision)'
        required: false
        default: 'X.Y.Z-SNAPSHOT'
        type: string
      perform_version:
        description: 'Tag which should be used to perform release and publish its artifacts'
        default: 'X.Y.Z'
        required: false
        type: string
      dry_run:
        # github have troubles handing this as a boolean
        description: 'Should execution abstain from mutating repository/remote state?'
        required: true
        default: 'true'
        type: string

      java_version:
        description: 'Java version used for build, used only when openhab input is not true'
        required: false
        default: 11
        type: number
      additional_profiles:
        description: 'Profiles which should be activated during the build'
        required: false
        default: ''
        type: string
      mvn_credentials:
        description: >-
          Maven servers, one per line: server-id:USERNAME_SECRET:PASSWORD_SECRET.
        required: false
        default: ''
        type: string
      mvn_repositories:
        description: 'Additional repositories, one per line: repository-id:url:snapshots-enabled'
        required: false
        default: ''
        type: string
      mvn_plugin_repositories:
        description: 'Additional plugin repositories, same format as mvn_repositories (defaults to mvn_repositories)'
        required: false
        default: ''
        type: string
      mvn_server_origins:
        description: >-
          Repository origins allowed to use server credentials, one per line: server-id:origin
          (i.e. thing4-snapshots:https://repository.connectorio.cloud). Requires Maven 3.10+.
        required: false
        default: ''
        type: string
    secrets:
      GPG_PASSPHRASE:
        required: true
        description: 'GPG key passphrase used to access private key'
      GPG_PRIVATE_KEY:
        required: true
        description: 'GPG key used to sign release artifacts'
      MAVEN_SECRETS:
        required: false
        description: >-
          JSON object with secrets referenced by mvn_credentials (secret name to value), built by the caller
          with toJSON for each value. Write it as a single line.

jobs:
  release:
    if: ${{ !inputs.openhab || github.ref_name == inputs.master_branch }}
    permissions:
      contents: write
    uses: './.github/workflows/maven-release.yml'
    secrets:
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      MAVEN_SECRETS: ${{ secrets.MAVEN_SECRETS }}
    with:
      release_version: ${{ inputs.release_version }}
      development_version: ${{ inputs.development_version }}
      perform_version: ${{ inputs.perform_version }}
      dry_run: ${{ inputs.dry_run == true || inputs.dry_run == 'true' }}
      java_version: ${{ inputs.java_version }}
      additional_profiles: ${{ inputs.additional_profiles }}
      mvn_credentials: ${{ inputs.mvn_credentials }}
      mvn_repositories: ${{ inputs.mvn_repositories }}
      mvn_plugin_repositories: ${{ inputs.mvn_plugin_repositories }}
      mvn_server_origins: ${{ inputs.mvn_server_origins }}

  release_oh3:
    # github.ref is set with workflow dispatch event
    if: ${{ inputs.openhab && startsWith(github.ref_name, '3.') || (inputs.master_branch == '3' && github.ref_name == 'master') }}
    permissions:
      contents: write
    uses: './.github/workflows/maven-release.yml'
    secrets:
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      MAVEN_SECRETS: ${{ secrets.MAVEN_SECRETS }}
    with:
      release_version: ${{ inputs.release_version }}
      development_version: ${{ inputs.development_version }}
      perform_version: ${{ inputs.perform_version }}
      dry_run: ${{ inputs.dry_run == true || inputs.dry_run == 'true' }}
      java_version: 11
      additional_profiles: ${{ inputs.additional_profiles }}
      mvn_credentials: ${{ inputs.mvn_credentials }}
      mvn_repositories: ${{ inputs.mvn_repositories }}
      mvn_plugin_repositories: ${{ inputs.mvn_plugin_repositories }}
      mvn_server_origins: ${{ inputs.mvn_server_origins }}

  release_oh4:
    if: ${{ inputs.openhab && startsWith(github.ref_name, '4.') || (inputs.master_branch == '4' && github.ref_name == 'master') }}
    permissions:
      contents: write
    uses: './.github/workflows/maven-release.yml'
    secrets:
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      MAVEN_SECRETS: ${{ secrets.MAVEN_SECRETS }}
    with:
      release_version: ${{ inputs.release_version }}
      development_version: ${{ inputs.development_version }}
      perform_version: ${{ inputs.perform_version }}
      dry_run: ${{ inputs.dry_run == true || inputs.dry_run == 'true' }}
      java_version: 17
      additional_profiles: ${{ inputs.additional_profiles }}
      mvn_credentials: ${{ inputs.mvn_credentials }}
      mvn_repositories: ${{ inputs.mvn_repositories }}
      mvn_plugin_repositories: ${{ inputs.mvn_plugin_repositories }}
      mvn_server_origins: ${{ inputs.mvn_server_origins }}

  release_oh5:
    if: ${{ inputs.openhab && startsWith(github.ref_name, '5.') || (inputs.master_branch == '5' && github.ref_name == 'master') }}
    permissions:
      contents: write
    uses: './.github/workflows/maven-release.yml'
    secrets:
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      MAVEN_SECRETS: ${{ secrets.MAVEN_SECRETS }}
    with:
      release_version: ${{ inputs.release_version }}
      development_version: ${{ inputs.development_version }}
      perform_version: ${{ inputs.perform_version }}
      dry_run: ${{ inputs.dry_run == true || inputs.dry_run == 'true' }}
      java_version: 21
      additional_profiles: ${{ inputs.additional_profiles }}
      mvn_credentials: ${{ inputs.mvn_credentials }}
      mvn_repositories: ${{ inputs.mvn_repositories }}
      mvn_plugin_repositories: ${{ inputs.mvn_plugin_repositories }}
      mvn_server_origins: ${{ inputs.mvn_server_origins }}
