name: Maven release

on:
  workflow_call:
    inputs:
      release_version:
        description: 'The version to be released from actual HEAD revision'
        required: false
        default: 'X.Y.Z'
        type: string
      development_version:
        description: 'Version to be set as next, after release is made (appends commit to HEAD revision)'
        required: false
        default: 'X.Y.Z-SNAPSHOT'
        type: string
      perform_version:
        description: 'Tag which should be used to perform release and publish its artifacts'
        required: false
        type: string
      dry_run:
        description: 'Should execution abstain from mutating repository/remote state?'
        required: true
        default: true
        type: boolean

      java_version:
        description: 'Java version used for build'
        required: false
        default: 11
        type: number
      additional_profiles:
        description: 'Profiles which should be activated during the build'
        required: false
        default: ''
        type: string
      mvn_credentials:
        description: >-
          Maven servers, one per line: server-id:USERNAME_SECRET:PASSWORD_SECRET.
        required: false
        default: ''
        type: string
      mvn_repositories:
        description: 'Additional repositories, one per line: repository-id:url:snapshots-enabled'
        required: false
        default: ''
        type: string
      mvn_plugin_repositories:
        description: 'Additional plugin repositories, same format as mvn_repositories (defaults to mvn_repositories)'
        required: false
        default: ''
        type: string
      mvn_server_origins:
        description: >-
          Repository origins allowed to use server credentials, one per line: server-id:origin
          (i.e. thing4-snapshots:https://repository.connectorio.cloud). Requires Maven 3.10+.
        required: false
        default: ''
        type: string

    secrets:
      GPG_PASSPHRASE:
        required: true
        description: 'GPG key passphrase used to access private key'
      GPG_PRIVATE_KEY:
        required: true
        description: 'GPG key used to sign release artifacts'
      MAVEN_SECRETS:
        required: false
        description: >-
          JSON object with secrets referenced by mvn_credentials (secret name to value), built by the caller
          with toJSON for each value. Write it as a single line.

jobs:
  build:
    permissions:
      contents: write
    runs-on: 'ubuntu-latest'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # 6.0.3
      - uses: connectorio/gh-actions-shared/.github/actions/github-debug-action@master
        if: runner.debug
        id: github-debug
      - uses: connectorio/gh-actions-shared/.github/actions/github-bot@master
        id: github-bot
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: connectorio/gh-actions-shared/.github/actions/setup-java@master
        id: setup
        with:
          java_version: ${{ inputs.java_version }}
          distribution: 'temurin'
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          mvn_credentials: ${{ inputs.mvn_credentials }}
          mvn_repositories: ${{ inputs.mvn_repositories }}
          mvn_plugin_repositories: ${{ inputs.mvn_plugin_repositories }}
          mvn_server_origins: ${{ inputs.mvn_server_origins }}
      - id: debug-secrets
        if: runner.debug
        env:
          SECRETS_VARS: ${{ toJson(secrets) }}
        run: echo "$SECRETS_VARS"
      - uses: connectorio/gh-actions-shared/.github/actions/maven-cache@master
        with:
          key: ${{ hashFiles('**/pom.xml') }}
      - name: 'Maven Prepare Release'
        id: maven-prepare-release
        if: inputs.release_version != '' && inputs.development_version != ''
        shell: 'sh'
        run: >-
          . "${{ steps.setup.outputs.POPULATE_SECRETS }}" &&
          mvn -B -ntp
          release:prepare
          ${{ inputs.additional_profiles && format('-P {0}', inputs.additional_profiles) || '' }}
          -DreleaseVersion=${{ inputs.release_version }}
          -DdevelopmentVersion=${{ inputs.development_version }}
          -DdryRun=${{ inputs.dry_run }}
          ${{ runner.debug && '-X' || '' }}
        env:
          MVN_CREDENTIALS: ${{ inputs.mvn_credentials }}
          MVN_SECRETS_JSON: ${{ secrets.MAVEN_SECRETS }}
      - name: 'Inject tag to perform release'
        id: prepare-perform-release
        if: inputs.perform_version != ''
        shell: 'sh'
        # See https://issues.apache.org/jira/browse/SCM-729 for why the release.properties file is required.
        # This section is borrowed from https://github.com/killbill/killbill/commit/1f376b2bae5f8d05fe916f73c5d7a207d2a083b2
        run: |
          echo "scm.url=scm\:git\:git@github.com\:${GITHUB_REPOSITORY}.git" > release.properties
          echo "scm.tag=${{ inputs.perform_version }}" >> release.properties
      - name: 'Maven Perform release'
        id: maven-perform-release
        if: inputs.perform_version != ''
        shell: 'sh'
        run: >-
          . "${{ steps.setup.outputs.POPULATE_SECRETS }}" &&
          mvn -B -ntp release:perform
          -DreleaseProfiles=release
          ${{ inputs.additional_profiles && format('-P {0}', inputs.additional_profiles) || '' }}
          -DdryRun=${{ inputs.dry_run }}
          ${{ runner.debug && '-X' || '' }}
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          MVN_CREDENTIALS: ${{ inputs.mvn_credentials }}
          MVN_SECRETS_JSON: ${{ secrets.MAVEN_SECRETS }}

      - name: Rollback on failure
        id: maven-rollback-release
        if: failure()
        shell: 'sh'
        run: |
          . "${{ steps.setup.outputs.POPULATE_SECRETS }}"
          mvn -B -ntp release:rollback
          echo "You may need to manually delete the git tag, if it was created."
        env:
          MVN_CREDENTIALS: ${{ inputs.mvn_credentials }}
          MVN_SECRETS_JSON: ${{ secrets.MAVEN_SECRETS }}
