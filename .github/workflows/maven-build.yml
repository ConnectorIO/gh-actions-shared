name: Maven build

on:
  workflow_call:
    inputs:
      openhab:
        description: 'Turns "openHAB" mode for build which assume certain branch policies (3.*=java 11, 4.*=java 17, 5.*=java 21)'
        required: false
        default: false
        type: boolean
      java_version:
        description: 'Java version used for build, used only when openhab input is not true'
        required: false
        default: '11'
        type: string
      additional_profiles:
        description: 'Profiles which should be activated during the build'
        required: false
        default: ''
        type: string
      additional_options:
        description: 'Additional build options'
        required: false
        default: ''
        type: string
      matrix_os:
        description: 'Platform to run on'
        default: 'ubuntu-latest'
        type: string
      deploy:
        description: 'Should maven deploy be called'
        default: false
        type: boolean
      skip_test_publish:
        description: 'Skip publishing of test report'
        default: false
        type: boolean
      mvn_credentials:
        description: >-
          Maven servers, one per line: server-id:USERNAME_SECRET:PASSWORD_SECRET.
        required: false
        default: ''
        type: string
      mvn_repositories:
        description: 'Additional repositories, one per line: repository-id:url:snapshots-enabled'
        required: false
        default: ''
        type: string
      mvn_plugin_repositories:
        description: 'Additional plugin repositories, same format as mvn_repositories (defaults to mvn_repositories)'
        required: false
        default: ''
        type: string
      mvn_server_origins:
        description: >-
          Repository origins allowed to use server credentials, one per line: server-id:origin
          (i.e. thing4-snapshots:https://repository.connectorio.cloud). Requires Maven 3.10+.
        required: false
        default: ''
        type: string
    secrets:
      MAVEN_SECRETS:
        required: false
        description: >-
          JSON object with secrets referenced by mvn_credentials (secret name to value), built by the caller
          with toJSON for each value. Write it as a single line.

jobs:
  build:
    permissions:
      checks: write
      contents: read
    runs-on: ${{ inputs.matrix_os }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # 6.0.3
        with:
          fetch-depth: 0
      - uses: connectorio/gh-actions-shared/.github/actions/github-debug-action@master
        id: github-debug
        if: runner.debug
      - uses: connectorio/gh-actions-shared/.github/actions/setup-java@master
        id: setup
        with:
          java_version: ${{ inputs.java_version }}
          mvn_credentials: ${{ inputs.mvn_credentials }}
          mvn_repositories: ${{ inputs.mvn_repositories }}
          mvn_plugin_repositories: ${{ inputs.mvn_plugin_repositories }}
          mvn_server_origins: ${{ inputs.mvn_server_origins }}
      - id: debug-secrets
        if: runner.debug
        env:
          SECRETS_VARS: ${{ toJson(secrets) }}
        run: echo "$SECRETS_VARS"
      - uses: connectorio/gh-actions-shared/.github/actions/maven-cache@master
        with:
          key: ${{ hashFiles('**/pom.xml') }}
      - name: 'Calculate PR version'
        if: github.event_name == 'pull_request'
        shell: 'bash'
        run: |
          . "${{ steps.setup.outputs.POPULATE_SECRETS }}"
          profiles='${{ inputs.additional_profiles && format('-P {0},cicd', inputs.additional_profiles) || '-Pcicd' }}';
          mvn -B -ntp org.apache.maven.plugins:maven-help-plugin:3.4.0:evaluate -Dexpression=project.version -q -DforceStdout $profiles -Dcicd=true
          baseVersion=$(mvn -B -ntp org.apache.maven.plugins:maven-help-plugin:3.4.0:evaluate -Dexpression=project.version -q -DforceStdout $profiles -Dcicd=true)
          pullRequestId="pr-${{ github.event.pull_request.number }}"
          mvn -B -ntp versions:set -DnewVersion=${baseVersion//-/"-$pullRequestId-"} $profiles -Dcicd=true
        env:
          MVN_CREDENTIALS: ${{ inputs.mvn_credentials }}
          MVN_SECRETS_JSON: ${{ secrets.MAVEN_SECRETS }}
      - name: 'Dump build environment for debug purposes'
        id: env-debug
        if: runner.debug
        shell: 'sh'
        # same environment as maven steps; values exported by populate-secrets.sh are masked
        run: |
          . "${{ steps.setup.outputs.POPULATE_SECRETS }}"
          cat ~/.m2/settings.xml
          echo "Environment variables available to maven:"
          env | sort
        env:
          MVN_CREDENTIALS: ${{ inputs.mvn_credentials }}
          MVN_SECRETS_JSON: ${{ secrets.MAVEN_SECRETS }}
      - name: 'Build with Maven'
        shell: 'sh'
        run: >-
          . "${{ steps.setup.outputs.POPULATE_SECRETS }}" &&
          mvn -B -V -e -ntp -fae clean verify -Dcicd=true
          -Daether.connector.http.connectionMaxTtl=120
          -Daether.connector.requestTimeout=300000
          -Daether.dependencyCollector.impl=bf
          -Dmaven.artifact.threads=25
          -Dsurefire.rerunFailingTestsCount=2
          -Dfailsafe.rerunFailingTestsCount=2
          ${{ inputs.additional_profiles && format('-P {0},cicd', inputs.additional_profiles) || '-Pcicd' }}
          ${{ inputs.additional_options || '' }}
          ${{ runner.debug && '-X' || '' }}
        env:
          MVN_CREDENTIALS: ${{ inputs.mvn_credentials }}
          MVN_SECRETS_JSON: ${{ secrets.MAVEN_SECRETS }}
      - name: 'Maven Deploy'
        if: ${{ success() && inputs.deploy || false }}
        shell: 'sh'
        run: >-
          . "${{ steps.setup.outputs.POPULATE_SECRETS }}" &&
          mvn -B -V -e -ntp -nsu deploy -Dcicd=true
          -Daether.connector.http.connectionMaxTtl=120
          -Daether.connector.requestTimeout=300000
          -Daether.dependencyCollector.impl=bf
          -Dmaven.artifact.threads=25
          -Dsurefire.rerunFailingTestsCount=2
          -Dfailsafe.rerunFailingTestsCount=2
          -Dmaven.test.skip=true
          -DretryFailedDeploymentCount=3
          ${{ inputs.additional_profiles && format('-P {0}', inputs.additional_profiles) || '' }}
          ${{ inputs.additional_options || '' }}
          ${{ runner.debug && '-X' || '' }}
        env:
          MVN_CREDENTIALS: ${{ inputs.mvn_credentials }}
          MVN_SECRETS_JSON: ${{ secrets.MAVEN_SECRETS }}
      - name: 'Remove snapshots from local repository'
        shell: sh
        run: >-
          find ~/.m2/repository -type d -name '-SNAPSHOT' -exec rm -rf {} \; -print
      - name: 'Publish Test Report'
        if: ${{ !inputs.skip_test_publish && (success() || failure()) }}
        uses: ScalableCapital/action-surefire-report@1e92f48016e566e4eed2d81560edbfe0f524cfb7 # v2.0.2
      - name: 'Upload Test Report'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !inputs.skip_test_publish && (success() || failure()) }}
        with:
          name: 'java-test-report-${{ runner.os }}-java-${{ inputs.java_version }}'
          path: |
            **/surefire-reports/TEST-*.xml
            **/failsafe-reports/TEST-*.xml
