name: Maven

on:
  workflow_call:
    inputs:
      openhab:
        description: 'Turns "openHAB" mode for build which assume certain branch policies (3.*=java 11, 4.*=java 17, 5.*=java 21)'
        required: false
        default: false
        type: boolean
      master_branch:
        description: 'Determine if repository uses master branch and, if build uses openHAB mode, in which OH version it is expected to operate (v 3 or 4 or 5)'
        required: false
        default: 'master'
        type: string
      server_id:
        description: 'Server id used in case if results are deployed'
        required: false
        default: 'sonatype-nexus'
        type: string
      java_version:
        description: 'Java version used for build, used only when openhab input is not true'
        required: false
        default: 11
        type: number
      additional_profiles:
        description: 'Profiles which should be activated during the build'
        required: false
        default: ''
        type: string
      additional_options:
        description: 'Additional build options'
        required: false
        default: ''
        type: string
      deploy:
        description: 'Should maven deploy be called'
        default: true
        type: boolean
      skip_test_publish:
        description: 'Skip publishing of test report'
        default: false
        type: boolean
      mvn_credentials:
        description: >-
          Additional Maven servers, one per line: server-id:USERNAME_SECRET:PASSWORD_SECRET.
          Acts as whitelist - listed secrets are taken from declared secrets or MAVEN_SECRETS JSON.
        required: false
        default: ''
        type: string
      mvn_repositories:
        description: 'Additional repositories, one per line: repository-id:url:snapshots-enabled'
        required: false
        default: ''
        type: string
      mvn_plugin_repositories:
        description: 'Additional plugin repositories, same format as mvn_repositories (defaults to mvn_repositories)'
        required: false
        default: ''
        type: string
    secrets:
      CI_DEPLOY_USERNAME:
        required: true
        description: 'Username used for deployment'
      CI_DEPLOY_PASSWORD:
        required: true
        description: 'Password used for deployment'
      MAVEN_SECRETS:
        required: false
        description: >-
          JSON object with additional secrets referenced by mvn_credentials, i.e.
          { "CI_DOCKER_USERNAME": toJSON(secrets.CI_DOCKER_USERNAME) } wrapped in expression syntax

jobs:
  build:
    # Build if PR targets master branch or commits were pushed to master branch
    if: ${{ !inputs.openhab && github.ref_type == 'branch' && (github.base_ref == inputs.master_branch || github.ref_name == inputs.master_branch) && !contains(github.event.commits[0].message, '[maven-release-plugin] prepare release') }}
    permissions:
      checks: write
      contents: read
    strategy:
      matrix:
        os: [ 'ubuntu-latest' ]
      fail-fast: false
    uses: 'connectorio/gh-actions-shared/.github/workflows/maven-build.yml@master'
    secrets:
      CI_DEPLOY_USERNAME: ${{ secrets.CI_DEPLOY_USERNAME }}
      CI_DEPLOY_PASSWORD: ${{ secrets.CI_DEPLOY_PASSWORD }}
      MAVEN_SECRETS: ${{ secrets.MAVEN_SECRETS }}
    with:
      matrix_os: ${{ matrix.os }}
      openhab: ${{ inputs.openhab }}
      server_id: ${{ inputs.server_id }}
      java_version: ${{ inputs.java_version }}
      additional_profiles: ${{ inputs.additional_profiles }}
      additional_options: ${{ inputs.additional_options }}
      deploy: ${{ inputs.deploy }}
      skip_test_publish: ${{ inputs.skip_test_publish }}
      mvn_credentials: ${{ inputs.mvn_credentials }}
      mvn_repositories: ${{ inputs.mvn_repositories }}
      mvn_plugin_repositories: ${{ inputs.mvn_plugin_repositories }}

  build_oh3:
    # github.base_ref points to target branch of pull request, head_ref is branch from which PR is made
    # github.ref_name is set when git push is made
    if: >-
      ${{ 
      inputs.openhab && github.ref_type == 'branch'
      && (startsWith(github.ref_name, '3.') || startsWith(github.base_ref, '3.') || (inputs.master_branch == '3' && (github.ref_name == 'master' || github.base_ref == 'master')))
      && !contains(github.event.commits[0].message, '[maven-release-plugin] prepare release')
      }}
    permissions:
      checks: write
      contents: read
    strategy:
      matrix:
        java: [ '11' ]
        os: [ 'ubuntu-latest' ]
      fail-fast: false
    uses: 'connectorio/gh-actions-shared/.github/workflows/maven-build.yml@master'
    secrets:
      CI_DEPLOY_USERNAME: ${{ secrets.CI_DEPLOY_USERNAME }}
      CI_DEPLOY_PASSWORD: ${{ secrets.CI_DEPLOY_PASSWORD }}
      MAVEN_SECRETS: ${{ secrets.MAVEN_SECRETS }}
    with:
      matrix_os: ${{ matrix.os }}
      openhab: ${{ inputs.openhab }}
      server_id: ${{ inputs.server_id }}
      java_version: ${{ matrix.java }}
      additional_profiles: ${{ inputs.additional_profiles }}
      additional_options: ${{ inputs.additional_options }}
      deploy: ${{ inputs.deploy }}
      skip_test_publish: ${{ inputs.skip_test_publish }}
      mvn_credentials: ${{ inputs.mvn_credentials }}
      mvn_repositories: ${{ inputs.mvn_repositories }}
      mvn_plugin_repositories: ${{ inputs.mvn_plugin_repositories }}

  build_oh4:
    if: >-
      ${{
      inputs.openhab && github.ref_type == 'branch'
      && (startsWith(github.ref_name, '4.') || startsWith(github.base_ref, '4.') || (inputs.master_branch == '4' && (github.ref_name == 'master' || github.base_ref == 'master')))
      && !contains(github.event.commits[0].message, '[maven-release-plugin] prepare release')
      }}
    permissions:
      checks: write
      contents: read
    strategy:
      matrix:
        java: [ '17' ]
        os: [ 'ubuntu-latest' ]
      fail-fast: false
    uses: 'connectorio/gh-actions-shared/.github/workflows/maven-build.yml@master'
    secrets:
      CI_DEPLOY_USERNAME: ${{ secrets.CI_DEPLOY_USERNAME }}
      CI_DEPLOY_PASSWORD: ${{ secrets.CI_DEPLOY_PASSWORD }}
      MAVEN_SECRETS: ${{ secrets.MAVEN_SECRETS }}
    with:
      matrix_os: ${{ matrix.os }}
      openhab: ${{ inputs.openhab }}
      server_id: ${{ inputs.server_id }}
      java_version: ${{ matrix.java }}
      additional_profiles: ${{ inputs.additional_profiles }}
      additional_options: ${{ inputs.additional_options }}
      deploy: ${{ inputs.deploy }}
      skip_test_publish: ${{ inputs.skip_test_publish }}
      mvn_credentials: ${{ inputs.mvn_credentials }}
      mvn_repositories: ${{ inputs.mvn_repositories }}
      mvn_plugin_repositories: ${{ inputs.mvn_plugin_repositories }}

  build_oh5:
    if: >-
      ${{
      inputs.openhab && github.ref_type == 'branch'
      && (startsWith(github.ref_name, '5.') || startsWith(github.base_ref, '5.') || (inputs.master_branch == '5' && (github.ref_name == 'master' || github.base_ref == 'master')))
      && !contains(github.event.commits[0].message, '[maven-release-plugin] prepare release')
      }}
    permissions:
      checks: write
      contents: read
    strategy:
      matrix:
        java: [ '21' ]
        os: [ 'ubuntu-latest' ]
      fail-fast: false
    uses: 'connectorio/gh-actions-shared/.github/workflows/maven-build.yml@master'
    secrets:
      CI_DEPLOY_USERNAME: ${{ secrets.CI_DEPLOY_USERNAME }}
      CI_DEPLOY_PASSWORD: ${{ secrets.CI_DEPLOY_PASSWORD }}
      MAVEN_SECRETS: ${{ secrets.MAVEN_SECRETS }}
    with:
      matrix_os: ${{ matrix.os }}
      openhab: ${{ inputs.openhab }}
      server_id: ${{ inputs.server_id }}
      java_version: ${{ matrix.java }}
      additional_profiles: ${{ inputs.additional_profiles }}
      additional_options: ${{ inputs.additional_options }}
      deploy: ${{ inputs.deploy }}
      skip_test_publish: ${{ inputs.skip_test_publish }}
      mvn_credentials: ${{ inputs.mvn_credentials }}
      mvn_repositories: ${{ inputs.mvn_repositories }}
      mvn_plugin_repositories: ${{ inputs.mvn_plugin_repositories }}

  debug:
    runs-on: 'ubuntu-latest'
    steps:
    - uses: connectorio/gh-actions-shared/.github/actions/github-debug-action@master